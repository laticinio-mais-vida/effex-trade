; Sincronização dos clientes do ERP com o EFFEX Trade. Copie este arquivo para config.ini e preencha.
; O config.ini tem a senha do banco e a chave de envio: não mande para o servidor nem para o git.

[banco]
; Cópia do banco do ERP (Firebird 2.1), a mesma que o BI Mais Vida lê. Só leitura, numa transação somente leitura.
arquivo = C:\Users\Micro\Documents\banco de dados\LATICINIOMAISVIDALTDA.GDB
host = localhost
usuario = SYSDBA
senha = COLOQUE_A_SENHA_AQUI
fbclient = C:\Program Files\Firebird\Firebird_2_1\bin\fbclient.dll
codificacao = cp1252

[envio]
; Endereço do EFFEX Trade, com /api no fim. Para testar com a API rodando no computador: http://localhost:3333
destino = https://effextrade.maisvida.cloud/api
; A mesma SYNC_KEY do servidor (/opt/effex-trade/api.env). Gere com: python -c "import secrets; print(secrets.token_urlsafe(32))"
chave =
